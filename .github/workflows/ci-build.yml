name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Whisper backend regression tests
        run: uv run --no-project python -m unittest discover -s tests -p test_voice_worker.py
      - name: Release snapshot regression tests
        run: |
          if [ -f release-scripts/sync-release-tree.test.mjs ]; then
            node --test release-scripts/sync-release-tree.test.mjs
          fi
      - run: npm run build
      - run: npm run test:access-entry
      - run: npm run test:extension
      - run: npm audit --omit=dev --audit-level=high
